name: HMM research correctness

on:
  push:
    paths:
      - "engine/research/**"
      - "scripts/fit_hmm_regimes.py"
      - "tests/test_hmm_regime.py"
      - "requirements-research.txt"
      - ".github/workflows/hmm-research-ci.yml"
  pull_request:
    paths:
      - "engine/research/**"
      - "scripts/fit_hmm_regimes.py"
      - "tests/test_hmm_regime.py"
      - "requirements-research.txt"
      - ".github/workflows/hmm-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Test HMM selection and causal filtering
        run: python -m unittest tests/test_hmm_regime.py -v
