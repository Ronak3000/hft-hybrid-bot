name: L2 forecasting and quoting research

on:
  pull_request:
    paths:
      - "engine/market_data/**"
      - "engine/research/**"
      - "engine/simulation/**"
      - "scripts/evaluate_lob_alpha.py"
      - "scripts/evaluate_alpha_quotes.py"
      - "tests/test_lob_alpha.py"
      - "tests/test_alpha_quotes.py"
      - "requirements-alpha.txt"
      - ".github/workflows/lob-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-alpha.txt
      - run: python -m unittest discover -s tests -p "test_lob_alpha.py" -v
      - run: python -m unittest discover -s tests -p "test_alpha_quotes.py" -v
