services:
  api:
    build: .
    restart: always
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APEX_OPERATOR_TOKEN=${APEX_OPERATOR_TOKEN:?Set an operator token for Docker}
      - TARDIS_API_KEY=${TARDIS_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data/workbench:/app/data/workbench
